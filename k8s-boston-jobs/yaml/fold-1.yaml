apiVersion: v1
kind: ConfigMap
metadata:
  name: boston-fold-1-config
data:
  CSV_PATH: "/app/data/HousingData.csv"
  TARGET: "MEDV"
  K: "5"
  FOLD: "1"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: boston-fold-1
  labels:
    app: boston-kfold
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: boston-kfold
    spec:
      restartPolicy: Never
      containers:
        - name: fold
          image: bojana0606/k8s-boston-jobs:1.0
          envFrom:
            - configMapRef:
                name: boston-fold-1-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
